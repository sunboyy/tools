<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live QR Generator</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #64748b;
        --accent: #0f766e;
        --border: #dbe5ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: radial-gradient(circle at top, #e8f3ff 0%, var(--bg) 45%, #eef2f7 100%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .app {
        width: min(760px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        padding: 22px;
        display: grid;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: 1.4rem;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      textarea {
        width: 100%;
        min-height: 120px;
        resize: vertical;
        border-radius: 12px;
        border: 1px solid var(--border);
        padding: 12px 14px;
        font: inherit;
        line-height: 1.4;
        outline: none;
      }

      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.15);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .qr-wrap {
        display: grid;
        place-items: center;
        border: 1px dashed var(--border);
        border-radius: 12px;
        padding: 14px;
        min-height: 280px;
        background: #fafcff;
      }

      canvas {
        max-width: 100%;
        height: auto;
      }

      .status {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .status.error {
        color: #b91c1c;
      }

      input[type="range"] {
        accent-color: var(--accent);
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.2.2/build/qrcode.min.js"></script>
  </head>
  <body>
    <main class="app">
      <div>
        <h1>Live QR Code Generator</h1>
        <p>Type anything below. The QR code updates on every keystroke.</p>
      </div>

      <label for="text">Input text or URL</label>
      <textarea id="text" placeholder="Enter text, link, or any content..."></textarea>

      <div class="row">
        <label for="size">Image size: <strong><span id="sizeValue">280</span>px</strong></label>
        <input id="size" type="range" min="120" max="900" value="280" step="10" />
      </div>

      <div class="qr-wrap">
        <canvas id="qrCanvas" width="280" height="280"></canvas>
      </div>

      <p id="status" class="status">Ready.</p>
    </main>

    <script>
      const textInput = document.getElementById("text");
      const sizeInput = document.getElementById("size");
      const sizeValue = document.getElementById("sizeValue");
      const canvas = document.getElementById("qrCanvas");
      const statusEl = document.getElementById("status");

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", isError);
      }

      function clearCanvas() {
        const context = canvas.getContext("2d");
        context.clearRect(0, 0, canvas.width, canvas.height);
      }

      function renderQR() {
        if (typeof window.QRCode === "undefined") {
          setStatus("Loading QR library...");
          return;
        }

        const value = textInput.value;
        const size = Number(sizeInput.value);
        sizeValue.textContent = size;
        canvas.width = size;
        canvas.height = size;

        if (!value.trim()) {
          clearCanvas();
          setStatus("Type something to generate a QR code.");
          return;
        }

        QRCode.toCanvas(
          canvas,
          value,
          {
            width: size,
            margin: 1,
            errorCorrectionLevel: "M"
          },
          (error) => {
            if (error) {
              clearCanvas();
              setStatus("Input is too large to encode as a QR code.", true);
              return;
            }

            setStatus(`Generated ${value.length} characters.`);
          }
        );
      }

      textInput.addEventListener("input", renderQR);
      sizeInput.addEventListener("input", renderQR);

      async function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }

      renderQR();
    </script>
  </body>
</html>
